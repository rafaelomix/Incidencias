<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>Incidencias de obra</title>
<meta name="theme-color" content="#1f4e79">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Incidencias">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icono.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icono-180.png">
<style>
  :root{
    --azul:#1f4e79; --azul2:#2e75b6; --fondo:#f2f4f7; --linea:#d9dee5; --texto:#1d2733; --gris:#6b7684;
    --activa:#d93025; --activa-f:#fce8e6; --gest:#f57c00; --gest-f:#fde8d4; --term:#188038; --term-f:#e6f4ea;
  }
  *{box-sizing:border-box}
  body{margin:0;font-family:-apple-system,Segoe UI,Roboto,Arial,sans-serif;background:var(--fondo);color:var(--texto);font-size:16px}
  header{position:sticky;top:0;z-index:10;background:var(--azul);color:#fff;display:flex;align-items:center;gap:8px;padding:10px 12px;box-shadow:0 2px 6px rgba(0,0,0,.2)}
  header h1{font-size:17px;margin:0;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  header button{background:rgba(255,255,255,.15);color:#fff;border:0;border-radius:8px;padding:7px 10px;font-size:14px}
  #usr{font-size:12px;opacity:.85;text-align:right;line-height:1.2}
  main{max-width:900px;margin:0 auto;padding:12px}
  .card{background:#fff;border:1px solid var(--linea);border-radius:12px;padding:12px;margin-bottom:10px}
  .item{display:flex;align-items:center;gap:10px;cursor:pointer}
  .item:active{background:#eef3fa}
  .grow{flex:1;min-width:0}
  .tit{font-weight:600;overflow:hidden;text-overflow:ellipsis}
  .sub{color:var(--gris);font-size:13px;margin-top:2px}
  .chips{display:flex;gap:4px;flex-wrap:wrap}
  .chip{border-radius:20px;padding:2px 8px;font-size:12px;font-weight:600;white-space:nowrap}
  .ch-ACTIVA{background:var(--activa-f);color:var(--activa)}
  .ch-GESTIONADA{background:var(--gest-f);color:#b45309}
  .ch-TERMINADA{background:var(--term-f);color:var(--term)}
  .b-ACTIVA{border-left:6px solid var(--activa)}
  .b-GESTIONADA{border-left:6px solid var(--gest)}
  .b-TERMINADA{border-left:6px solid var(--term)}
  .btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:0;border-radius:10px;padding:11px 14px;font-size:15px;font-weight:600;background:var(--azul2);color:#fff;cursor:pointer}
  a.btn{text-decoration:none}
  .btn.sec{background:#e8eef6;color:var(--azul)}
  .btn.peq{padding:7px 10px;font-size:13px}
  .btn:disabled{opacity:.5}
  .btn.e-ACTIVA{background:var(--activa)} .btn.e-GESTIONADA{background:var(--gest)} .btn.e-TERMINADA{background:var(--term)}
  .fila{display:flex;gap:8px;flex-wrap:wrap}
  .punto{width:14px;height:14px;border-radius:50%;flex:none;background:#c9d1db}
  .p-ACTIVA{background:var(--activa)} .p-GESTIONADA{background:var(--gest)} .p-TERMINADA{background:var(--term)}
  .grupo{margin:16px 4px 6px;font-weight:700;color:var(--azul)}
  .btn.verde{background:var(--term)}
  .fila .btn{flex:1}
  input,select,textarea{width:100%;font-size:16px;padding:10px;border:1px solid var(--linea);border-radius:8px;background:#fff;font-family:inherit}
  textarea{min-height:90px;resize:vertical}
  label{display:block;font-size:13px;color:var(--gris);margin:10px 0 4px}
  details summary{cursor:pointer;font-weight:600;color:var(--azul);padding:4px 0}
  .filtros{display:flex;gap:6px;overflow-x:auto;margin-bottom:10px}
  .filtros button{border:1px solid var(--linea);background:#fff;border-radius:20px;padding:6px 12px;font-size:13px;white-space:nowrap}
  .filtros button.on{background:var(--azul);color:#fff;border-color:var(--azul)}
  .fotos{display:grid;grid-template-columns:repeat(auto-fill,minmax(90px,1fr));gap:6px;margin-top:8px}
  .fotos .f{position:relative;aspect-ratio:1;background:#e3e7ec;border-radius:8px;overflow:hidden;display:flex;align-items:center;justify-content:center;color:var(--gris);font-size:12px}
  .fotos img{width:100%;height:100%;object-fit:cover;cursor:pointer}
  .fotos .x{position:absolute;top:3px;right:3px;background:rgba(0,0,0,.6);color:#fff;border:0;border-radius:50%;width:24px;height:24px}
  .com{border-top:1px solid var(--linea);padding:8px 0}
  .com .q{font-size:12px;color:var(--gris)}
  .estado{font-size:13px;font-weight:700;padding:3px 10px;border-radius:20px}
  .vacio{color:var(--gris);text-align:center;padding:24px}
  .aviso{background:#fff4d6;border:1px solid #f1d27a;border-radius:8px;padding:10px;margin-bottom:10px;font-size:14px}
  #carga{position:fixed;inset:0;background:rgba(255,255,255,.6);display:none;align-items:center;justify-content:center;z-index:50;font-weight:600;color:var(--azul);flex-direction:column;gap:10px}
  .spin{width:36px;height:36px;border:4px solid #c9d6e6;border-top-color:var(--azul2);border-radius:50%;animation:g 1s linear infinite}
  @keyframes g{to{transform:rotate(360deg)}}
  #toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);background:#323232;color:#fff;padding:10px 16px;border-radius:8px;font-size:14px;display:none;z-index:60;max-width:90%}
  /* modales */
  .modal{position:fixed;inset:0;background:#111;z-index:40;display:flex;flex-direction:column}
  .modal .barra{display:flex;gap:6px;padding:8px;background:#111;flex-wrap:wrap;align-items:center}
  .modal .barra button{background:#333;color:#fff;border:0;border-radius:8px;padding:8px 10px;font-size:14px}
  .modal .barra button.on{outline:2px solid #fff}
  .modal .lienzo{flex:1;overflow:auto;display:flex;align-items:center;justify-content:center;padding:8px}
  .modal canvas{max-width:100%;max-height:100%;touch-action:none;background:#fff}
  .modal img.grande{max-width:100%;max-height:100%}
  .color{width:30px;height:30px;border-radius:50%;padding:0!important;border:2px solid #555!important}
  .sep{flex:1}
</style>
</head>
<body>
<header>
  <button id="atras" onclick="atras()" style="display:none">&#8592;</button>
  <h1 id="titulo">Incidencias de obra</h1>
  <button id="refrescar" onclick="refrescarTodo()" title="Actualizar" style="display:none">&#8635;</button>
  <div id="usr"></div>
</header>
<main id="app"></main>
<div id="carga"><div class="spin"></div><div id="cargaTxt">Cargando...</div></div>
<div id="toast"></div>
<input type="file" id="archivoFoto" accept="image/*" style="display:none">

<script>
// ======================= CONFIGURACIÓN =======================
// Pega aquí la URL de tu script de Google (Implementar > Gestionar implementaciones), la que acaba en /exec
var API_URL = 'https://script.google.com/macros/s/AKfycbyoBkNx1Iq5DIOuwCHrksKphfwh8cl7xxLPy6qK5PTY7g4m4mKX592hhXKp23umJ6w7/exec';

// ======================= ESTADO Y UTILIDADES =======================
var ESTADOS = ['ACTIVA','GESTIONADA','TERMINADA'];
var NOM_EST = {ACTIVA:'Activa', GESTIONADA:'Gestionada', TERMINADA:'Terminada'};
var S = { ses:null, usuario:null, pila:[], promo:null, piso:null, filtro:'', cacheFotos:{}, cache:{}, vista:'' };

function $(id){ return document.getElementById(id); }
function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];}); }
function nl(s){ return esc(s).replace(/\n/g,'<br>'); }
function esAdmin(){ return S.usuario && S.usuario.rol === 'ADMIN'; }

// Llama a una función del script de Google. Se envía como texto plano para que el
// navegador no haga la consulta previa de CORS (Apps Script no la admite).
function run(fn){
  var args = Array.prototype.slice.call(arguments,1);
  if(API_URL.indexOf('PEGA_AQUI') === 0) return Promise.reject('Falta poner la URL del script en index.html (API_URL).');
  return fetch(API_URL, { method:'POST', body: JSON.stringify({ fn:fn, args:args }), redirect:'follow' })
    .then(function(resp){
      if(!resp.ok) throw 'Error de conexión con Google ('+resp.status+')';
      return resp.text();
    })
    .then(function(t){
      var j;
      try{ j = JSON.parse(t); }catch(e){ throw 'Respuesta no válida del script de Google. ¿Está publicado con acceso "Cualquier usuario"?'; }
      if(!j.ok) throw j.error || 'Error desconocido';
      return j.r;
    }, function(e){
      if(typeof e === 'string') throw e;
      throw 'Sin conexión con Google. Comprueba internet e inténtalo de nuevo.';
    });
}
function cargando(si, txt){ $('carga').style.display = si?'flex':'none'; $('cargaTxt').textContent = txt||'Cargando...'; }
function toast(t){ var e=$('toast'); e.textContent=t; e.style.display='block'; clearTimeout(e._t); e._t=setTimeout(function(){e.style.display='none';},3000); }
function fallo(msg){ cargando(false); alert(msg); if(/Sesión no válida|PIN incorrecto/.test(msg)){ salir(); } }

function guardarSesion(){ try{ localStorage.setItem('inc_ses', JSON.stringify(S.ses)); }catch(e){} }
function leerSesion(){ try{ return JSON.parse(localStorage.getItem('inc_ses')||'null'); }catch(e){ return null; } }

function chips(c, todos){
  c = c || {};
  var h = '';
  ESTADOS.forEach(function(e){ if(c[e] || todos) h += '<span class="chip ch-'+e+'">'+(c[e]||0)+' '+NOM_EST[e].toLowerCase()+'</span>'; });
  return h ? '<div class="chips">'+h+'</div>' : '<span class="sub">Sin incidencias</span>';
}

// ======================= DATOS CON MEMORIA =======================
// Pinta al momento lo que ya se cargó antes y lo actualiza en segundo plano.
function cargarCon(clave, fn, args, pintarFn){
  S.vista = clave;
  var c = S.cache[clave];
  if(c) pintarFn(c); else cargando(true);
  return run.apply(null, [fn].concat(args)).then(function(r){
    if(S.vista !== clave){ S.cache[clave] = r; return; }
    cargando(false);
    var cambia = !c || JSON.stringify(c) !== JSON.stringify(r);
    S.cache[clave] = r;
    if(!cambia) return;
    var foco = document.activeElement;
    if(c && foco && /INPUT|TEXTAREA|SELECT/.test(foco.tagName)) return;   // no borrar lo que se está escribiendo
    pintarFn(r);
  }).catch(function(m){
    if(c){ cargando(false); toast('No se pudo actualizar: '+m); } else fallo(m);
  });
}
function olvidar(){ S.cache = {}; }
function refrescarTodo(){ olvidar(); S.forzar = true; recargar(); }

// ======================= NAVEGACIÓN =======================
function ir(vista, titulo, render){
  S.pila.push({vista:vista, titulo:titulo, render:render});
  pintar();
}
function atras(){ if(S.pila.length>1){ S.pila.pop(); pintar(); } }
function pintar(){
  var v = S.pila[S.pila.length-1];
  $('titulo').textContent = v.titulo;
  $('atras').style.display = S.pila.length>1 ? '' : 'none';
  window.scrollTo(0,0);
  v.render();
}
function recargar(){ pintar(); }

// ======================= ENTRADA =======================
function inicio(){
  var s = leerSesion();
  if(s){
    cargando(true);
    run('login', s).then(function(u){ S.ses=s; S.usuario=u; cargando(false); entrar(); })
                   .catch(function(){ cargando(false); pantallaLogin(); });
  } else pantallaLogin();
}

function pantallaLogin(){
  $('usr').innerHTML=''; $('atras').style.display='none'; $('titulo').textContent='Incidencias de obra';
  $('app').innerHTML = '<div class="card"><h3 style="margin-top:0">Entrar</h3>'+
    '<label>Usuario</label><select id="lnom"><option>Cargando...</option></select>'+
    '<label>PIN</label><input id="lpin" type="password" inputmode="numeric" autocomplete="current-password">'+
    '<div style="margin-top:14px"><button class="btn" style="width:100%" onclick="hacerLogin()">Entrar</button></div></div>';
  run('listarUsuarios').then(function(l){
    $('lnom').innerHTML = l.map(function(n){ return '<option>'+esc(n)+'</option>'; }).join('');
  }).catch(fallo);
}

function hacerLogin(){
  var s = { nombre:$('lnom').value, pin:$('lpin').value };
  cargando(true);
  run('login', s).then(function(u){ S.ses=s; S.usuario=u; guardarSesion(); cargando(false); entrar(); })
                 .catch(function(m){ cargando(false); alert(m); });
}

function salir(){ try{ localStorage.removeItem('inc_ses'); }catch(e){} S.ses=null; S.usuario=null; S.pila=[]; pantallaLogin(); }

function entrar(){
  $('usr').innerHTML = esc(S.usuario.nombre)+'<br>'+esc(S.usuario.rol)+' · <a href="#" style="color:#fff" onclick="salir();return false">salir</a>';
  $('refrescar').style.display = '';
  S.pila = [];
  ir('promos','Promociones', vistaPromociones);
}

// ======================= PROMOCIONES =======================
function vistaPromociones(){
  var f = !!S.forzar; S.forzar = false;
  cargarCon('promos', 'getPromociones', [S.ses, f], pintarPromociones);
}
function pintarPromociones(r){
    var q = $('buscar') ? $('buscar').value : '';
    S.listaPromos = r.promociones;
    var h = '';
    if(r.aviso) h += '<div class="aviso">'+esc(r.aviso)+'</div>';
    h += '<input id="buscar" placeholder="Buscar promoción..." oninput="filtrarPromos()" style="margin-bottom:10px">';
    if(esAdmin()) h += '<div class="fila" style="margin-bottom:10px"><button class="btn sec" onclick="abrirTodas()">Todas las incidencias</button></div>';
    h += '<div id="listaPromos"></div>';
    $('app').innerHTML = h;
    $('buscar').value = q;
    filtrarPromos();
}

function filtrarPromos(){
  var q = ($('buscar').value||'').toLowerCase();
  var l = S.listaPromos.filter(function(p){ return !q || (p.nombre+' '+(p.info.codigo||'')).toLowerCase().indexOf(q)>=0; });
  $('listaPromos').innerHTML = l.length ? l.map(function(p,i){
    return '<div class="card item" onclick="abrirPromo(\''+p.id+'\')">'+
      '<div class="grow"><div class="tit">'+esc(p.nombre)+'</div>'+
      '<div class="sub">'+(p.info.codigo?'Obra '+esc(p.info.codigo)+' · ':'')+(p.info.jefe?esc(p.info.jefe):'')+'</div>'+
      '<div style="margin-top:6px">'+chips(p.cuentas)+'</div></div><div>&#8250;</div></div>';
  }).join('') : '<div class="vacio">No hay promociones.</div>';
}

function abrirPromo(id){
  var p = S.listaPromos.filter(function(x){ return x.id===id; })[0];
  ir('promo', p ? p.nombre : 'Promoción', function(){ vistaPromo(id); });
}

function enlacesMapa(i){
  var gps = (i.gps||'').replace(/\s/g,'');
  var destino = gps || (i.direccion||'').trim();
  if(!destino) return '';
  var q = encodeURIComponent(destino);
  return '<a class="btn sec peq" target="_blank" href="https://www.google.com/maps/search/?api=1&query='+q+'">Ver en Maps</a>'+
         '<a class="btn peq" target="_blank" href="https://www.google.com/maps/dir/?api=1&travelmode=driving&destination='+q+'">&#129517; Cómo llegar</a>';
}
function botonLlamar(tel){
  tel = (tel||'').replace(/[^0-9+]/g,'');
  return tel ? '<a class="btn verde peq" href="tel:'+tel+'">&#128222; Llamar</a>' : '';
}

function vistaPromo(id){
  var f = !!S.forzar; S.forzar = false;
  cargarCon('promo:'+id, 'getPromocion', [S.ses, id, f], pintarPromo);
}
function pintarPromo(p){
    S.promo = p;
    if(!S.filtroPisos) S.filtroPisos = '';
    var i = p.info || {};
    var mapa = enlacesMapa(i);
    var h = '<div class="card"><details '+(esAdmin() && !i.codigo ? 'open':'')+'><summary>Detalles de la promoción</summary>';
    if(esAdmin()){
      h += '<label>Código de obra</label><input id="pCod" value="'+esc(i.codigo)+'">'+
           '<label>Jefe de obra</label><input id="pJefe" value="'+esc(i.jefe)+'">'+
           '<label>Teléfono del jefe de obra</label><div class="fila"><input id="pTel" type="tel" style="flex:2" value="'+esc(i.telefono)+'">'+botonLlamar(i.telefono)+'</div>'+
           '<label>Ubicación GPS (lat, lng)</label><div class="fila"><input id="pGps" style="flex:2" value="'+esc(i.gps)+'" placeholder="42.8125, -1.6458">'+
           '<button class="btn sec peq" onclick="miUbicacion()">Mi ubicación</button></div>'+
           '<label>Dirección</label><input id="pDir" value="'+esc(i.direccion)+'">'+
           '<label>Notas</label><textarea id="pNotas">'+esc(i.notas)+'</textarea>'+
           '<div class="fila" style="margin-top:10px"><button class="btn" onclick="guardarPromo()">Guardar detalles</button></div>'+
           (mapa?'<div class="fila" style="margin-top:8px">'+mapa+'</div>':'');
      if(i.actualizado) h += '<div class="sub" style="margin-top:6px">Actualizado '+esc(i.actualizado)+' por '+esc(i.por)+'</div>';
    } else {
      h += '<div class="sub" style="margin-top:6px">Código de obra</div><div>'+(esc(i.codigo)||'—')+'</div>'+
           '<div class="sub" style="margin-top:6px">Jefe de obra</div><div class="fila" style="align-items:center"><span class="grow">'+(esc(i.jefe)||'—')+
             (i.telefono?' · '+esc(i.telefono):'')+'</span>'+botonLlamar(i.telefono)+'</div>'+
           '<div class="sub" style="margin-top:6px">Dirección</div><div>'+(esc(i.direccion)||'—')+'</div>'+
           '<div class="sub" style="margin-top:6px">Ubicación</div><div class="fila">'+(mapa||'—')+'</div>'+
           (i.notas?'<div class="sub" style="margin-top:6px">Notas</div><div>'+nl(i.notas)+'</div>':'');
    }
    h += '</details></div>';
    h += '<div class="card"><div class="tit">Incidencias de la promoción</div><div style="margin-top:6px">'+chips(p.cuentas,true)+'</div>'+
         '<div style="margin-top:8px"><button class="btn sec peq" onclick="abrirIncPromo()">Ver todas las de esta promoción</button></div></div>';
    h += '<h3 style="margin:16px 4px 8px">Pisos ('+p.pisos.length+')</h3><div id="filtroPisos"></div><div id="listaPisos"></div>';
    $('app').innerHTML = h;
    pintarPisos();
}

// Color del piso: rojo si tiene alguna activa, naranja si alguna gestionada, verde si todas terminadas
function colorPiso(c){
  c = c || {};
  if(c.ACTIVA) return 'ACTIVA';
  if(c.GESTIONADA) return 'GESTIONADA';
  if(c.TERMINADA) return 'TERMINADA';
  return '';
}
function pasaFiltroPiso(c, f){
  c = c || {};
  if(!f) return true;
  if(f === 'CON') return (c.ACTIVA||0)+(c.GESTIONADA||0)+(c.TERMINADA||0) > 0;
  if(f === 'SIN') return !((c.ACTIVA||0)+(c.GESTIONADA||0)+(c.TERMINADA||0));
  return colorPiso(c) === f;
}
function botonesFiltroPisos(lista, fnCuentas, alPulsar){
  var opc = [['','Todos'],['CON','Con incidencias'],['ACTIVA','&#128308; Rojo'],['GESTIONADA','&#128992; Naranja'],['TERMINADA','&#128994; Verde'],['SIN','Sin incidencias']];
  return '<div class="filtros">'+opc.map(function(o){
    var n = lista.filter(function(x){ return pasaFiltroPiso(fnCuentas(x), o[0]); }).length;
    return '<button class="'+(S.filtroPisos===o[0]?'on':'')+'" onclick="'+alPulsar+'(\''+o[0]+'\')">'+o[1]+' ('+n+')</button>';
  }).join('')+'</div>';
}
function filtrarPisos(f){ S.filtroPisos = f; pintarPisos(); }
function pintarPisos(){
  var p = S.promo;
  $('filtroPisos').innerHTML = botonesFiltroPisos(p.pisos, function(x){ return x.cuentas; }, 'filtrarPisos');
  var h = '';
  p.pisos.forEach(function(x,k){
    if(!pasaFiltroPiso(x.cuentas, S.filtroPisos)) return;
    h += '<div class="card item" onclick="abrirPiso('+k+')"><span class="punto p-'+colorPiso(x.cuentas)+'"></span>'+
         '<div class="grow"><div class="tit">'+esc(x.nombre)+'</div><div style="margin-top:4px">'+chips(x.cuentas)+'</div></div><div>&#8250;</div></div>';
  });
  $('listaPisos').innerHTML = h || '<div class="vacio">'+(p.pisos.length?'Ningún piso en este filtro.':'No hay planos (PDF) en esta carpeta.')+'</div>';
}

function miUbicacion(){
  if(!navigator.geolocation){ alert('Este dispositivo no da la ubicación.'); return; }
  cargando(true,'Obteniendo ubicación...');
  navigator.geolocation.getCurrentPosition(function(pos){
    cargando(false);
    $('pGps').value = pos.coords.latitude.toFixed(6)+', '+pos.coords.longitude.toFixed(6);
  }, function(e){ cargando(false); alert('No se pudo obtener la ubicación: '+e.message); }, {enableHighAccuracy:true, timeout:15000});
}

function guardarPromo(){
  var d = { codigo:$('pCod').value, jefe:$('pJefe').value, telefono:$('pTel').value, gps:$('pGps').value, direccion:$('pDir').value, notas:$('pNotas').value };
  cargando(true,'Guardando...');
  run('guardarPromocion', S.ses, S.promo.nombre, d).then(function(){ cargando(false); olvidar(); toast('Detalles guardados'); recargar(); }).catch(fallo);
}

// ======================= PISO =======================
function abrirPiso(k){
  S.piso = S.promo.pisos[k];
  S.filtro = '';
  ir('piso', S.piso.nombre, vistaPiso);
}

function vistaPiso(){
  var p = S.piso;

  S.incConPiso = conPiso; S.incConPromo = conPromo;
  cargarCon(clave, fn, args, function(l){ S.listaInc = l; pintarIncidencias(); });
}

function pintarIncidencias(){
  var l = S.listaInc || [];
  var c = {ACTIVA:0,GESTIONADA:0,TERMINADA:0};
  l.forEach(function(i){ c[i.estado]++; });
  var f = '<div class="filtros"><button class="'+(!S.filtro?'on':'')+'" onclick="filtrar(\'\')">Todas ('+l.length+')</button>';
  ESTADOS.forEach(function(e){ f += '<button class="'+(S.filtro===e?'on':'')+'" onclick="filtrar(\''+e+'\')">'+NOM_EST[e]+' ('+c[e]+')</button>'; });
  f += '</div>';
  var v = l.filter(function(i){ return !S.filtro || i.estado===S.filtro; });
  if(S.incConPiso){
    f += '<div class="filtros"><button class="'+(S.modoInc==='pisos'?'on':'')+'" onclick="modoInc(\'pisos\')">&#127970; Por pisos</button>'+
         '<button class="'+(S.modoInc==='lista'?'on':'')+'" onclick="modoInc(\'lista\')">&#9776; Lista</button></div>';
    if(S.modoInc === 'pisos'){ $('listaInc').innerHTML = f + pisosConIncidencias(v); return; }
  }
  $('listaInc').innerHTML = f + (v.length ? v.map(function(i){
    return '<div class="card item b-'+i.estado+'" onclick="abrirIncidencia(\''+i.id+'\')"><div class="grow">'+
      '<div class="tit">'+esc(i.descripcion || '(sin texto)')+'</div>'+
      '<div class="sub">'+(S.incConPromo?esc(i.promocion)+' · ':'')+(S.incConPiso?esc(i.piso)+' · ':'')+esc(i.usuario)+' · '+esc(i.fecha)+'</div>'+
      '<div class="sub">'+(i.fotos.length?'&#128247; '+i.fotos.length+'  ':'')+(i.comentarios?'&#128172; '+i.comentarios:'')+'</div></div>'+
      '<span class="chip ch-'+i.estado+'">'+NOM_EST[i.estado]+'</span></div>';
  }).join('') : '<div class="vacio">No hay incidencias'+(S.filtro?' en este estado':'')+'.</div>');
}
function filtrar(e){ S.filtro = e; pintarIncidencias(); }
function modoInc(m){ S.modoInc = m; pintarIncidencias(); }

// Agrupa las incidencias por promoción y piso (los pisos que tienen incidencias)
function pisosConIncidencias(lista){
  var promos = {}, orden = [];
  lista.forEach(function(i){
    if(!promos[i.promocion]){ promos[i.promocion] = {}; orden.push(i.promocion); }
    var g = promos[i.promocion];
    if(!g[i.piso]) g[i.piso] = { piso:i.piso, pisoId:i.pisoId, cuentas:{ACTIVA:0,GESTIONADA:0,TERMINADA:0} };
    g[i.piso].cuentas[i.estado]++;
  });
  if(!orden.length) return '<div class="vacio">No hay pisos con incidencias'+(S.filtro?' en este estado':'')+'.</div>';
  orden.sort(function(a,b){ return a.localeCompare(b,'es',{numeric:true}); });
  S.gruposPisos = [];
  var h = '';
  orden.forEach(function(pr){
    var pisos = Object.keys(promos[pr]).map(function(k){ return promos[pr][k]; })
                      .sort(function(a,b){ return a.piso.localeCompare(b.piso,'es',{numeric:true}); });
    if(S.incConPromo) h += '<div class="grupo">'+esc(pr)+' ('+pisos.length+' pisos)</div>';
    pisos.forEach(function(x){
      var k = S.gruposPisos.length;
      S.gruposPisos.push({promocion:pr, piso:x.piso, pisoId:x.pisoId});
      h += '<div class="card item" onclick="abrirPisoDirecto('+k+')"><span class="punto p-'+colorPiso(x.cuentas)+'"></span>'+
           '<div class="grow"><div class="tit">'+esc(x.piso)+'</div><div style="margin-top:4px">'+chips(x.cuentas)+'</div></div><div>&#8250;</div></div>';
    });
  });
  return h;
}

function abrirPisoDirecto(k){
  var g = S.gruposPisos[k];
  if(!S.promo || S.promo.nombre !== g.promocion) S.promo = { nombre:g.promocion, pisos:[] };
  S.piso = { nombre:g.piso, id:g.pisoId };
  S.filtro = '';
  ir('piso', g.piso, vistaPiso);
}

function verPdf(id){
  var w = window.open('', '_blank');
  cargando(true,'Abriendo plano...');
  run('abrirPdf', S.ses, id).then(function(r){
    cargando(false);
    if(r.url){ if(w) w.location = r.url; else window.open(r.url,'_blank'); return; }
    var bin = atob(r.datos), arr = new Uint8Array(bin.length);
    for(var i=0;i<bin.length;i++) arr[i]=bin.charCodeAt(i);
    var url = URL.createObjectURL(new Blob([arr],{type:'application/pdf'}));
    if(w) w.location = url; else window.open(url,'_blank');
  }).catch(function(m){ if(w) w.close(); fallo(m); });
}

// Miniatura pequeña para los listados (la foto grande solo se descarga al tocarla)
function miniatura(dataUrl){
  return new Promise(function(ok){
    var img = new Image();
    img.onload = function(){
      var e = Math.min(1, 360 / Math.max(img.width, img.height));
      var c = document.createElement('canvas');
      c.width = Math.round(img.width*e); c.height = Math.round(img.height*e);
      c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
      ok(c.toDataURL('image/jpeg', 0.6));
    };
    img.onerror = function(){ ok(''); };
    img.src = dataUrl;
  });
}

// Sube todas las fotos a la vez (en paralelo)
function subirFotos(lista){
  if(!lista.length) return Promise.resolve([]);
  var hechas = 0;
  cargando(true, 'Subiendo fotos (0 de '+lista.length+')...');
  var promo = S.promo ? S.promo.nombre : 'General';
  return Promise.all(lista.map(function(d){
    return miniatura(d).then(function(mini){
      return run('subirFoto', S.ses, promo, d, mini).then(function(id){
        hechas++; $('cargaTxt').textContent = 'Subiendo fotos ('+hechas+' de '+lista.length+')...';
        if(mini && m2(id)) S.cacheFotos[m2(id)] = mini;   // la miniatura ya la tenemos: no hace falta descargarla
        return id;
      });
    });
  }));
}
function m2(id){ return String(id).split(':')[1] || ''; }

function enviarIncidencia(){
  var desc = $('nDesc').value.trim();
  if(!desc && !S.fotosNuevas.length){ alert('Escribe una descripción o añade una foto.'); return; }
  subirFotos(S.fotosNuevas).then(function(ids){
    cargando(true,'Guardando incidencia...');
    return run('crearIncidencia', S.ses, {promocion:S.promo.nombre, piso:S.piso.nombre, pisoId:S.piso.id, descripcion:desc, fotos:ids});
  }).then(function(id){
    cargando(false); olvidar(); toast('Incidencia '+id+' guardada');
    S.pila.pop(); pintar();
  }).catch(fallo);
}

// Cada foto se guarda como "idGrande:idMiniatura" (las antiguas solo tienen un id)
function fotosRemotas(ids){
  if(!ids || !ids.length) return '';
  return '<div class="fotos">'+ids.map(function(f){
    var p = String(f).split(':');
    return '<div class="f" data-grande="'+esc(p[0])+'" data-mini="'+esc(p[1]||p[0])+'">&middot;&middot;&middot;</div>';
  }).join('')+'</div>';
}

function cargarFotosRemotas(){
  var celdas = Array.prototype.slice.call(document.querySelectorAll('[data-mini]'));
  var pedir = [];
  function poner(cel){
    var d = S.cacheFotos[cel.getAttribute('data-mini')];
    if(d === undefined || d === null) return false;
    if(!d){ cel.textContent = '(sin foto)'; return true; }
    cel.innerHTML = '<img src="'+d+'">';
    cel.firstChild.onclick = function(){ verFotoGrande(cel.getAttribute('data-grande'), d); };
    return true;
  }
  celdas.forEach(function(cel){ if(!poner(cel)) pedir.push(cel.getAttribute('data-mini')); });
  if(!pedir.length) return;
  run('getMinis', S.ses, pedir.filter(function(x,k){ return pedir.indexOf(x)===k; })).then(function(r){
    Object.keys(r).forEach(function(k){ S.cacheFotos[k] = r[k]; });
    celdas.forEach(poner);
  }).catch(function(){ celdas.forEach(function(c){ if(!c.querySelector('img')) c.textContent='(sin foto)'; }); });
}

// Muestra la miniatura ampliada al momento y la cambia por la foto grande cuando llega
function verFotoGrande(id, mini){
  var m = verGrande(S.cacheFotos['g:'+id] || mini);
  if(S.cacheFotos['g:'+id]) return;
  run('getFoto', S.ses, id).then(function(d){
    S.cacheFotos['g:'+id] = d;
    var im = m.querySelector('img'); if(im) im.src = d;
  }).catch(function(){});
}

// ======================= FOTOS: ELEGIR Y DIBUJAR =======================
var MAX_LADO = 1400;   // tamaño de las fotos (px): suficiente y más rápido de subir

function elegirFoto(alTerminar){
  var inp = $('archivoFoto');
  inp.value = '';
  inp.onchange = function(){
    var f = inp.files && inp.files[0];
    if(!f) return;
    var lector = new FileReader();
    lector.onload = function(){ editorFoto(lector.result, alTerminar); };
    lector.readAsDataURL(f);
  };
  inp.click();
}

function editorFoto(src, alTerminar, maxLado){
  var img = new Image();
  img.onload = function(){
    var esc2 = Math.min(1, (maxLado || MAX_LADO) / Math.max(img.width, img.height));
    var W = Math.round(img.width*esc2), Hh = Math.round(img.height*esc2);
    var m = document.createElement('div');
    m.className = 'modal';
    var colores = ['#ff0000','#ffd400','#00a2ff','#00c853','#000000','#ffffff'];
    m.innerHTML = '<div class="barra">'+
      colores.map(function(c,k){ return '<button class="color'+(k===0?' on':'')+'" data-c="'+c+'" style="background:'+c+'"></button>'; }).join('')+
      '<button data-h="lapiz" class="on">&#9999;&#65039; Lápiz</button><button data-h="texto">T Texto</button>'+
      '<button data-g="4">Fino</button><button data-g="9" class="on">Medio</button><button data-g="18">Grueso</button>'+
      '<button id="eDesh">Deshacer</button><button id="eBorrar">Borrar todo</button><span class="sep"></span>'+
      '<button id="eCanc">Cancelar</button><button id="eOk" style="background:#2e75b6">Usar foto</button></div>'+
      '<div class="lienzo"><canvas></canvas></div>';
    document.body.appendChild(m);
    var cv = m.querySelector('canvas'), cx = cv.getContext('2d');
    cv.width = W; cv.height = Hh;
    var trazos = [], actual = null, color = colores[0], grosor = 9, herramienta = 'lapiz';
    var k = Math.max(1, W/1000);
    function pintarTexto(t){
      var tam = Math.round((18 + t.g*3) * k);
      cx.font = 'bold '+tam+'px Arial, sans-serif';
      cx.textBaseline = 'middle';
      cx.lineWidth = Math.max(3, tam/6);
      cx.strokeStyle = (t.c === '#ffffff' || t.c === '#ffd400') ? '#000000' : '#ffffff';
      t.s.split('\n').forEach(function(linea, n){
        cx.strokeText(linea, t.x, t.y + n*tam*1.15);
        cx.fillStyle = t.c;
        cx.fillText(linea, t.x, t.y + n*tam*1.15);
      });
    }
    function redibujar(){
      cx.drawImage(img, 0, 0, W, Hh);
      cx.lineCap = 'round'; cx.lineJoin = 'round';
      trazos.forEach(function(t){
        if(t.s !== undefined){ pintarTexto(t); return; }
        cx.strokeStyle = t.c; cx.lineWidth = t.g * Math.max(1, W/1000);
        cx.beginPath();
        t.p.forEach(function(p,k){ if(k===0) cx.moveTo(p[0],p[1]); else cx.lineTo(p[0],p[1]); });
        if(t.p.length===1) cx.lineTo(t.p[0][0]+0.1, t.p[0][1]+0.1);
        cx.stroke();
      });
    }
    function punto(ev){
      var r = cv.getBoundingClientRect();
      return [ (ev.clientX - r.left) * W / r.width, (ev.clientY - r.top) * Hh / r.height ];
    }
    cv.addEventListener('pointerdown', function(ev){
      ev.preventDefault();
      if(herramienta === 'texto'){
        var pt = punto(ev);
        var txt = prompt('Texto a escribir:', '');
        if(txt){ trazos.push({c:color, g:grosor, x:pt[0], y:pt[1], s:txt}); redibujar(); }
        return;
      }
      cv.setPointerCapture(ev.pointerId); actual = {c:color, g:grosor, p:[punto(ev)]}; trazos.push(actual); redibujar();
    });
    cv.addEventListener('pointermove', function(ev){
      if(!actual) return;
      ev.preventDefault();
      var a = actual.p[actual.p.length-1], b = punto(ev);
      actual.p.push(b);
      // dibuja solo el tramo nuevo (más fluido en el móvil)
      cx.strokeStyle = actual.c; cx.lineWidth = actual.g * Math.max(1, W/1000);
      cx.lineCap = 'round'; cx.lineJoin = 'round';
      cx.beginPath(); cx.moveTo(a[0],a[1]); cx.lineTo(b[0],b[1]); cx.stroke();
    });
    var fin = function(){ actual = null; };
    cv.addEventListener('pointerup', fin); cv.addEventListener('pointercancel', fin);
    Array.prototype.forEach.call(m.querySelectorAll('[data-c]'), function(b){
      b.onclick = function(){ color = b.getAttribute('data-c'); Array.prototype.forEach.call(m.querySelectorAll('[data-c]'), function(x){ x.classList.remove('on'); }); b.classList.add('on'); };
    });
    Array.prototype.forEach.call(m.querySelectorAll('[data-g]'), function(b){
      b.onclick = function(){ grosor = +b.getAttribute('data-g'); Array.prototype.forEach.call(m.querySelectorAll('[data-g]'), function(x){ x.classList.remove('on'); }); b.classList.add('on'); };
    });
    Array.prototype.forEach.call(m.querySelectorAll('[data-h]'), function(b){
      b.onclick = function(){ herramienta = b.getAttribute('data-h'); Array.prototype.forEach.call(m.querySelectorAll('[data-h]'), function(x){ x.classList.remove('on'); }); b.classList.add('on'); };
    });
    m.querySelector('#eDesh').onclick = function(){ trazos.pop(); redibujar(); };
    m.querySelector('#eBorrar').onclick = function(){ if(confirm('¿Borrar todo lo dibujado?')){ trazos = []; redibujar(); } };
    m.querySelector('#eCanc').onclick = function(){ document.body.removeChild(m); };
    m.querySelector('#eOk').onclick = function(){
      var d = cv.toDataURL('image/jpeg', maxLado ? 0.85 : 0.78);
      document.body.removeChild(m);
      alTerminar(d);
    };
    redibujar();
  };
  img.onerror = function(){ alert('No se pudo abrir la imagen.'); };
  img.src = src;
}

// ======================= DIBUJAR SOBRE EL PLANO (PDF) =======================
// pdf.js (versión "legacy", compatible con móviles algo antiguos), cargado solo cuando hace falta
var PDFJS = 'https://cdn.jsdelivr.net/npm/pdfjs-dist@4.10.38/legacy/build/';
var LADO_PLANO = 2400;   // resolución de la imagen del plano

function cargarPdfJs(){
  if(window.pdfjsLib) return Promise.resolve(window.pdfjsLib);
  return import(PDFJS + 'pdf.min.mjs').then(function(lib){
    lib.GlobalWorkerOptions.workerSrc = PDFJS + 'pdf.worker.min.mjs';
    window.pdfjsLib = lib;
    return lib;
  }, function(){ throw 'No se pudo cargar el visor de PDF. Comprueba la conexión.'; });
}

function marcarPlano(idPdf, alTerminar){
  if(!idPdf){ alert('Este piso no tiene plano.'); return; }
  cargando(true, 'Abriendo plano...');
  var lib;
  cargarPdfJs().then(function(l){
    lib = l;
    if(S.cachePdf && S.cachePdf.id === idPdf) return S.cachePdf.datos;
    return run('getPdfDatos', S.ses, idPdf).then(function(r){ S.cachePdf = {id:idPdf, datos:r.datos}; return r.datos; });
  }).then(function(b64){
    var bin = atob(b64), arr = new Uint8Array(bin.length);
    for(var i=0;i<bin.length;i++) arr[i] = bin.charCodeAt(i);
    return lib.getDocument({data:arr}).promise;
  }).then(function(pdf){
    var n = 1;
    if(pdf.numPages > 1){
      cargando(false);
      var r = prompt('El plano tiene '+pdf.numPages+' páginas. ¿Cuál quieres marcar?', '1');
      if(r === null) return null;
      n = Math.min(pdf.numPages, Math.max(1, parseInt(r,10) || 1));
      cargando(true, 'Abriendo plano...');
    }
    return pdf.getPage(n);
  }).then(function(pag){
    if(!pag) return null;
    var v1 = pag.getViewport({scale:1});
    var esc3 = Math.min(5, LADO_PLANO / Math.max(v1.width, v1.height));
    var vp = pag.getViewport({scale:esc3});
    var cv = document.createElement('canvas');
    cv.width = Math.round(vp.width); cv.height = Math.round(vp.height);
    var cx = cv.getContext('2d');
    cx.fillStyle = '#ffffff'; cx.fillRect(0,0,cv.width,cv.height);
    return pag.render({canvasContext:cx, viewport:vp}).promise.then(function(){ return cv.toDataURL('image/jpeg', 0.9); });
  }).then(function(imagen){
    cargando(false);
    if(imagen) editorFoto(imagen, alTerminar, LADO_PLANO);
  }).catch(function(m){ fallo(typeof m === 'string' ? m : (m && m.message) || 'No se pudo abrir el plano.'); });
}
